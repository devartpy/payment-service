[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=25,<27",
    "uvicorn[standard]>=0.34,<1",
    "faststream[cli,rabbit]>=0.7,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
kafka = ["aiokafka>=0.11,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
