services:
  db:
    image: postgres:18.6-alpine
    ports:
      # DB_PORT is the Windows host port; PostgreSQL listens on 5432 in Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  consumer:
    build:
      context: .
      target: runtime
    command: ["faststream", "run", "src.consumer.app:app"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.consumer.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true

  publisher:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "src.publisher.main"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consumer:
        condition: service_healthy
    restart: unless-stopped
    init: true

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    init: true

volumes:
  postgres_data:
  rabbitmq_data:
